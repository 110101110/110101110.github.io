---
layout: default
title: Home
---
{% assign desktop = site.data.images['homepage_1.png'] %}
{% assign mobile = site.data.images['homepage_2.png'] %}
<div class="home-image">
  <a href="{{ '/' | relative_url }}">
    <picture>
      <source media="(max-width: 480px)" type="image/webp" srcset="{% include image-srcset.html image=mobile format='webp' %}" sizes="100vw" width="{{ mobile.width }}" height="{{ mobile.height }}">
      <source media="(max-width: 480px)" srcset="{% include image-srcset.html image=mobile format='fallback' %}" sizes="100vw" width="{{ mobile.width }}" height="{{ mobile.height }}">
      <source type="image/webp" srcset="{% include image-srcset.html image=desktop format='webp' %}" sizes="(max-width: 1100px) 100vw, 1100px">
      <img src="{{ desktop.fallback | relative_url }}" srcset="{% include image-srcset.html image=desktop format='fallback' %}" sizes="(max-width: 1100px) 100vw, 1100px" width="{{ desktop.width }}" height="{{ desktop.height }}" alt="BadSeed" loading="eager" fetchpriority="high" decoding="async">
    </picture>
  </a>
</div>
